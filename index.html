 chatUnsub=onChildAdded(rquery(rref(rdb,'chats/'+raceId+'/messages'),limitToLast(100)),snap=>{
  const val=snap.val();if(!val)return;

function share(){const h=(S.det&&$('#modal'))?'#/atividade/'+S.det:(location.hash||'#/home'),u=location.href.split('#')[0]+h;try{navigator.clipboard.writeText(u).then(()=>toast('Ligação copiada'),()=>toast(u))}catch(_){toast(u)}}
function ics(id){const a=A(id),p=n=>String(n).padStart(2,'0'),st=new Date(a.date+'T'+a.tm),en=new Date(st.getTime()+(a.dur?a.dur:120)*6e4),f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00',cl=x=>String(x).replace(/[,;\n]/g,' ');const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PACE//PT','BEGIN:VEVENT','UID:'+a.id+'@pace','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+f(st),'DTEND:'+f(en),'SUMMARY:'+cl(a.title),'LOCATION:'+cl(a.place),'END:VEVENT','END:VCALENDAR'].join('\r\n');try{const u=URL.createObjectURL(new Blob([t],{type:'text/calendar'})),l=document.createElement('a');l.href=u;l.download='treino-'+a.id+'.ics';document.body.appendChild(l);l.click();l.remove();toast('Ficheiro .ics gerado')}catch(_){toast('Não foi possível gerar o .ics')}}
function fromHash(){const m=location.hash.match(/^#\/(\w+)(?:\/([\w-]+))?/);if(!m)return;const r=m[1],p=m[2]||null;if(r==='atividade'){S.pendAct=p;return}if(r==='info'&&!INFO[p])return;if(['canal','atleta','info','registo'].includes(r)||NAV.some(n=>n[0]===r))go(r,p,true)}
/* ============ EVENTOS ============ */
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-act]");if(!t)return;
 const a=t.dataset.act,d=t.dataset;
 switch(a){
  case'go':closeModal();$("#drawer")&&$("#drawer").classList.remove("open");go(d.r);break;
  case'menu':{const dr=$("#drawer");dr.classList.toggle("open");const bg=$(".burger");bg.setAttribute("aria-expanded",dr.classList.contains("open"));break}
  case'login':closeModal();$("#drawer")&&$("#drawer").classList.remove("open");signIn();break;
  case'logout':closeModal();$("#drawer")&&$("#drawer").classList.remove("open");try{await signOut(auth);toast('Sessão terminada');go('home')}catch(_){toast('Não foi possível terminar a sessão.')}break;
  case'enter':enter(d.id);break;
  case'close':closeModal();break;
  case'info':go("info",d.k);break;
  case'toast':toast(d.m);break;
  case'newact':if(!isMember(S.param))return toast('Entra no canal para criar atividades.');actForm();break;
  case'det':showDet(d.id);break;
  case'jact':jact(d.id);break;
  case'lact':lact(d.id);break;
  case'cact':cact(d.id);break;
  case'eact':closeModal();actForm(d.id);break;
  case'canal':go('canal',d.id);break;
  case'atleta':go('atleta',d.id);break;
  case'tab':S.tab=d.t;render();break;
  case'atl':S.tab='membros';render();{const sb=$('.sb');sb&&sb.scrollIntoView({block:'start'})}break;
  case'leave':try{const up={channels:arrayRemove(d.id)};if(S.user.raceId===d.id)up.raceId='';await updateDoc(doc(db,'users',UID()),up);toast('Saíste do canal')}catch(er){subErr(er)}break;
  case'send':sendMsg();break;
  case'copy':{const m=(CHAT[S.param]||[]).find(x=>x.k===d.k);if(m)try{navigator.clipboard.writeText(m.text).then(()=>toast('Texto copiado'),()=>toast('Não foi possível copiar'))}catch(_){toast('Não foi possível copiar')}break}
  case'rep':modal(`<h2>Denunciar</h2><p class='note' style='margin-bottom:10px'>A denúncia é enviada à equipa PACE para revisão.</p><label for='rp-t'>Motivo</label><textarea id='rp-t' maxlength='300' placeholder='Descreve o problema'></textarea><div class='acts'><button class='btn btn-p' data-act='sendrep' data-uid='${esc(d.uid||'')}' data-k='${esc(d.k||'')}'>Enviar denúncia</button><button class='btn btn-o' data-act='close'>Cancelar</button></div>`);break;
  case'sendrep':{const tx=($('#rp-t')||{}).value||'';if(tx.trim().length<3)return toast('Indica o motivo.');try{await addDoc(collection(db,'reports'),{by:UID(),target:d.uid||'',msgKey:d.k||'',race:S.param&&S.route==='canal'?S.param:'',text:tx.trim().slice(0,300),ts:serverTimestamp()});closeModal();toast('Denúncia enviada')}catch(er){subErr(er)}break}
  case'blk':try{const has=BL.has(d.id);await updateDoc(doc(db,'users',UID()),{blocked:has?arrayRemove(d.id):arrayUnion(d.id)});toast(has?'Atleta desbloqueado':'Atleta bloqueado: as mensagens ficam ocultas')}catch(er){subErr(er)}break;
  case'back':history.length>1?history.back():go('home');break;
  case'share':share();break;
  case'hg':try{await updateDoc(doc(db,'users',UID()),{hid:!S.user.hid})}catch(er){subErr(er)}break;
  case'clear':S.q="";S.country="";S.sort="rel";render();break;
  case'scroll':{const el=$("#provas");el&&el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});break}
  case'sf':S.sf=d.s;S.tab=d.t;render();break;
  case'fav':{if(!S.user)return toast('Inicia sessão para guardar favoritos.');const k=d.k,has=FAV.has(k);try{await updateDoc(doc(db,'users',UID()),{favs:has?arrayRemove(k):arrayUnion(k)});toast(has?'Removido dos favoritos':'Guardado nos favoritos')}catch(er){subErr(er)}break}
  case'vt':F.org=d.id;go('treinos');break;
  case'nox':F.org='';render();break;
  case'ics':ics(d.id);break;
  case'pro':proDet(d.id);break;
  case'nt':{const b=writeBatch(db);NT.filter(n=>!n.r).forEach(n=>b.update(doc(db,'users',UID(),'notifs',n.id),{r:true}));try{await b.commit()}catch(er){subErr(er)}break}
  case'rmphoto':try{await updateDoc(doc(db,'users',UID()),{photo:''});toast('A usar a foto do Google')}catch(er){subErr(er)}break;
 }
});
document.addEventListener("keydown",e=>{if(e.target.id==='cin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();return}if(e.key==="Escape"){closeModal();const d=$("#drawer");d&&d.classList.remove("open")}});
const XM={'x-n':'n','x-km':'km','x-c':'c','x-d':'d','x-g':'g'};
['input','change'].forEach(ev=>document.addEventListener(ev,async e=>{
 const t=e.target,i=t.id;
 if(i==='q'){S.q=t.value;$("#grid").innerHTML=raceGrid()}
 else if(i==='country'){S.country=t.value;$("#grid").innerHTML=raceGrid()}
 else if(i==='sort'){S.sort=t.value;$("#grid").innerHTML=raceGrid()}
 else if(i==='x-q'){F.q=t.value;$('#xl').innerHTML=xlist()}
 else if(i==='x-s'||i==='x-o'||i==='x-b'||i==='x-v'){if(i==='x-s')F.sp=t.value;if(i==='x-o')F.o=t.value;if(i==='x-b')F.beg=t.checked;if(i==='x-v')F.vag=t.checked;$('#xl').innerHTML=xlist()}
 else if(XM[i]){F[XM[i]]=t.value;$('#xl').innerHTML=xlist()}
 else if(i==='bf-q')$('#bfl').innerHTML=bflist(t.value);
 else if(i==='bf-s'){BS=t.value;$('#bfl').innerHTML=bflist($('#bf-q').value)}
 else if(i==='p-v'||i==='p-b'){S.af[i==='p-v'?'vag':'beg']=t.checked;const p=$('#pl');p&&(p.innerHTML=plist(S.param))}
 else if(i==='s-ph'&&ev==='change'&&t.files[0]){try{const d=await resizeImg(t.files[0]);await updateDoc(doc(db,'users',UID()),{photo:d});toast('Foto atualizada')}catch(er){toast(errMsg(er))}t.value=''}
 else if(i==='o-ph'&&ev==='change'&&t.files[0]){try{S.tmpPhoto=await resizeImg(t.files[0]);const keep={};['o-n','o-un','o-c','o-city','o-r','o-g','o-gt','o-z'].forEach(k=>keep[k]=$('#'+k).value);const sp=[...document.querySelectorAll('[name=sp]:checked')].map(c=>c.value),h=$('#o-h').checked;render();Object.entries(keep).forEach(([k,v])=>$('#'+k).value=v);document.querySelectorAll('[name=sp]').forEach(c=>c.checked=sp.includes(c.value));$('#o-h').checked=h}catch(er){toast(errMsg(er))}}
 if(t.closest&&t.closest('#af')){if(i==='a-s'){S.draft['a-s']=t.value;$('#sfw').innerHTML=sf(t.value);restore()}else S.draft[i]=t.type==='checkbox'?t.checked:t.value}
}));
document.addEventListener("submit",e=>{
 e.preventDefault();const id=e.target.id;
 if(id==='af')pubAct();else if(id==='onb')finishOnb();else if(id==='setf')saveSettings()});
/* ============ ARRANQUE ============ */
try{history.replaceState({r:'home',p:null},'')}catch(_){}
addEventListener('popstate',e=>{closeModal();const s=e.state||{r:'home',p:null};go(s.r,s.p,true)});
render();fromHash();
</script>
