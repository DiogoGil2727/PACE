<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PACE — Find your pace. Find your people.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7FAF8;--surface:#fff;--green:#75C99A;--green-d:#174B35;--green-l:#EAF7EF;--text:#19251F;--muted:#6B7971;--line:#E2EAE4;--danger:#B3261E;
--r:14px;--sh:0 1px 2px rgba(23,75,53,.06),0 6px 20px rgba(23,75,53,.07);--f:'Manrope','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light}}
html{scroll-padding-top:72px;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{line-height:1.15;margin:0;letter-spacing:-.02em;color:var(--green-d)}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green-d);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:700;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;cursor:default}
.btn-p{background:var(--green-d);color:#fff}.btn-p:hover{background:#0f3624}
.btn-g{background:var(--green);color:var(--green-d)}.btn-g:hover{background:#63bd8b}
.btn-o{background:#fff;border-color:var(--line);color:var(--green-d)}.btn-o:hover{border-color:var(--green)}
.btn-w{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.7);color:#fff}.btn-w:hover{background:rgba(255,255,255,.26)}
.btn-sm{min-height:38px;padding:0 16px;font-size:.92rem}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* header */
header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:800;font-size:1.3rem;color:var(--green-d);letter-spacing:.02em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--green-d);display:grid;place-items:center;color:var(--green)}
nav.main{display:flex;gap:2px;margin-left:auto;align-items:center}
nav.main button{background:none;border:0;padding:8px 11px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap}
nav.main button:hover{color:var(--green-d);background:var(--green-l)}
nav.main button[aria-current="page"]{color:var(--green-d);background:var(--green-l)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:12px;width:44px;height:44px;place-items:center}
@media (max-width:1100px){nav.main{display:none}.burger{display:grid}.bar .btn-sm.reg{display:none}}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(15,40,28,.45);display:none}
.drawer.open{display:block}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(320px,86vw);background:#fff;padding:20px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.drawer .panel button.nv{text-align:left;background:none;border:0;padding:12px 12px;border-radius:12px;font-weight:600}
.drawer .panel button.nv[aria-current="page"]{background:var(--green-l);color:var(--green-d)}
/* hero */
.hero{position:relative;min-height:min(86vh,720px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#2f7d5b}
.hero .art,.hero img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(95deg,rgba(10,40,26,.72) 0%,rgba(10,40,26,.35) 55%,rgba(10,40,26,.08) 100%)}
.hero .in{position:relative;z-index:2;padding:96px 20px 72px;max-width:1180px;margin:0 auto;width:100%}
.hero h1{color:#fff;font-size:clamp(3.2rem,10vw,6.5rem);font-weight:800;letter-spacing:.01em}
.hero .slogan{font-size:clamp(1.15rem,2.6vw,1.6rem);font-weight:600;margin-top:10px;color:#CFF0DC}
.hero .lead{max-width:540px;margin-top:18px;font-size:1.08rem;color:#F1FAF5}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
/* sections */
section.sec{padding:80px 0}
.head{max-width:640px;margin-bottom:32px}
.head h2{font-size:clamp(1.8rem,4vw,2.6rem)}
.head p{color:var(--muted);margin-top:10px;font-size:1.05rem}
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.field{position:relative;flex:1 1 240px}
.field svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
input,select{width:100%;min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:0 14px}
.field input{padding-left:44px}
select{width:auto;min-width:170px;padding-right:10px}
input:focus,select:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(117,201,154,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px)}
.thumb{position:relative;height:170px;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.thumb .tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);color:var(--green-d);font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:1.2rem}
.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.93rem}
.meta svg.i{width:16px;height:16px}
.note{font-size:.82rem;color:var(--muted)}
.card .btn{margin-top:auto}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:44px 24px;text-align:center;background:#fff;color:var(--muted)}
.empty h3{margin-bottom:8px}
.empty .btn{margin-top:16px}
/* steps */
.steps{background:var(--green-l)}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;padding-top:18px;border-top:2px solid var(--green-d)}
.steps li::before{content:counter(s);font-weight:800;font-size:2rem;color:var(--green-d)}
.steps h3{font-size:1.2rem;margin:6px 0}
.steps p{color:#3d5a4b}
@media (max-width:760px){.steps ol{grid-template-columns:1fr}}
.final{text-align:center;background:var(--green-d);color:#fff;border-radius:24px;padding:64px 24px}
.final h2{color:#fff;max-width:620px;margin:0 auto 24px;font-size:clamp(1.8rem,4vw,2.5rem)}
/* page shells */
.page{padding:56px 0 80px;min-height:60vh}
.page h1{font-size:clamp(2rem,5vw,3rem);margin-bottom:12px}
.badge{display:inline-block;background:var(--green-l);color:var(--green-d);font-weight:700;font-size:.82rem;padding:4px 12px;border-radius:999px}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--sh);max-width:560px}
form .row{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-weight:600;font-size:.93rem}
.err{color:var(--danger);font-size:.85rem;min-height:1em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.alert{background:var(--green-l);border-left:4px solid var(--green);padding:12px 14px;border-radius:10px;font-size:.92rem;color:var(--green-d);margin-bottom:18px}
/* paginas de informacao */
.legal{max-width:720px;color:var(--muted);line-height:1.65}.legal h2{color:var(--text);font-size:1.15rem;margin:26px 0 8px}.legal p{margin:0 0 12px}.legal ul{margin:0 0 12px;padding-left:20px;display:grid;gap:6px}.legal strong{color:var(--text)}.legal .upd{font-size:.88rem}
/* footer */
footer{background:#fff;border-top:1px solid var(--line);padding:48px 0 36px;margin-top:0}
footer .links{display:flex;flex-wrap:wrap;gap:6px 20px;margin:18px 0}
footer .links button,footer .links a{background:none;border:0;padding:6px 0;color:var(--green-d);font-weight:600;text-decoration:none}
footer .links button:hover,footer .links a:hover{text-decoration:underline}
footer .disc{color:var(--muted);font-size:.88rem;max-width:720px}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,40,28,.5);display:grid;place-items:center;padding:20px}
.modal .dlg{background:#fff;border-radius:20px;padding:28px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:1.5rem;margin-bottom:10px}
.modal .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--green-d);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:80;font-weight:600;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:300px;border-radius:18px;background:linear-gradient(90deg,#edf3ef 25%,#f7faf8 50%,#edf3ef 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

const INFO={
 sobre:["Sobre",`<p>A PACE é uma plataforma social gratuita para atletas amadores que vão participar em provas IRONMAN 70.3. Ajuda-te a encontrar pessoas que vão à mesma prova que tu, com objetivos semelhantes, e a combinar treinos presenciais de bike, corrida e natação em águas abertas.</p>
<h2>Como funciona</h2>
<p>Cada prova tem o seu canal. Ao entrares, vês quem mais vai à prova, falas com eles no chat e podes criar ou participar em treinos marcados no calendário. Tudo gira à volta de uma ideia simples: uma prova é mais fácil quando não a preparas sozinho.</p>
<h2>Para quem é</h2>
<p>Para quem treina por gosto: quem vai fazer o primeiro 70.3, quem quer melhorar o tempo e quem só procura companhia para as saídas longas. Não é preciso ser rápido, é preciso querer treinar acompanhado.</p>
<h2>Independência</h2>
<p>A PACE é um projeto independente e não tem qualquer afiliação oficial com a IRONMAN. IRONMAN e IRONMAN 70.3 são marcas dos respetivos titulares. Os treinos são organizados pelos próprios atletas, não pela PACE.</p>`],

 privacidade:["Privacidade",`<p class="upd">Última atualização: outubro de 2026</p>
<p>Esta página explica que dados pessoais a PACE trata, para quê, e como podes controlá-los. A PACE é um projeto independente e é responsável pelo tratamento dos dados descritos abaixo.</p>

<h2>Para que usamos os dados</h2>
<p>Para criar e mostrar o teu perfil, ligar-te a atletas da mesma prova, permitir o chat e a organização de treinos, enviar-te avisos sobre os teus treinos e tratar denúncias de comportamento abusivo. Não vendemos os teus dados e não os usamos para publicidade.</p>
<h2>Serviços de terceiros</h2>
<p>A PACE usa serviços da Google: Firebase (autenticação e base de dados, em servidores na Europa quando indicado) e Google Fonts (tipo de letra). Ao carregar a página, o teu endereço IP é visto por estes serviços. Não usamos cookies de publicidade nem de rastreamento; o navegador guarda localmente apenas o necessário para manteres a sessão iniciada.</p>

 termos:["Termos",`<p class="upd">Última atualização: outubro de 2026</p>
<p>Ao criares conta e usares a PACE aceitas estes termos. Se não concordares, não uses o serviço.</p>
<h2>1. O serviço</h2>
<p>A PACE é uma plataforma gratuita que permite a atletas amadores encontrarem-se, conversarem e combinarem treinos para provas IRONMAN 70.3. A PACE não organiza treinos, não é uma entidade desportiva e não presta aconselhamento médico, de treino ou de nutrição.</p>
<h2>2. Conta</h2>
<p>Entras com a tua conta Google. És responsável pela tua conta e pela veracidade da informação do perfil. Só podes ter uma conta, e o username não pode ser alterado depois de criado.</p>

<p>Trata os outros com respeito. Não é permitido assediar, ameaçar, discriminar, fazer spam, publicar conteúdo ilegal ou ofensivo, nem partilhar dados pessoais de terceiros sem autorização. Podes denunciar mensagens e perfis e bloquear atletas.</p>

<h2>6. Moderação</h2>
<p>Podemos remover conteúdo, limitar ou suspender contas que violem estes termos ou ponham outros atletas em risco.</p>
<h2>7. Disponibilidade</h2>

 seguranca:["Segurança nos treinos",`<p>Treinar em grupo é mais divertido e mais seguro, desde que se tomem algumas precauções. A PACE liga atletas, mas cada um é responsável pela sua segurança. Estes princípios aplicam-se a todos os treinos.</p>
<h2>Antes de ires</h2>
<ul><li>Combina o encontro em locais públicos e conhecidos, de preferência de dia.</li>
<li>Avisa alguém de confiança do percurso, da hora prevista e de com quem vais.</li>
<li>Não partilhes moradas privadas. Usa pontos de encontro públicos.</li>
<li>Lê a descrição, a distância, o ritmo e a dificuldade. Se não tens a certeza de acompanhar, pergunta no chat ou escolhe um treino para iniciantes.</li>
<li>Vê a meteorologia e o estado do mar ou da estrada. Se as condições forem más, adia.</li>
<li>Leva telemóvel carregado, água e identificação. Se tiveres problemas de saúde, fala primeiro com o teu médico.</li></ul>
<h2>Bike</h2>
<ul><li>Usa capacete, luzes e roupa visível.</li>
<li>Respeita o código da estrada e não corras riscos para acompanhar o grupo.</li>
<li>Leva material de reparação, câmara de ar e o essencial para um furo.</li>
<li>Em grupo, mantém distâncias e avisa os outros de obstáculos e paragens.</li></ul>
<h2>Corrida</h2>
<ul><li>Leva água e usa roupa visível, sobretudo ao nascer e ao pôr do sol.</li>
<li>Respeita o teu ritmo; ninguém é obrigado a acompanhar os mais rápidos.</li>
<li>Em estrada, corre de frente para o trânsito quando não houver passeio.</li></ul>
<h2>Natação em águas abertas</h2>
<ul><li>Nada sempre acompanhado e nunca sozinho.</li>
<li>Usa boia de segurança e touca de cor viva.</li>
<li>Confirma as condições do mar, a corrente e a temperatura da água antes de entrares.</li>
<li>Combina um sinal de ajuda e sai da água ao primeiro sinal de cansaço ou frio excessivo.</li></ul>
<h2>Se algo correr mal</h2>
<p>Em caso de emergência, liga 112. Se alguém se comportar de forma inadequada ou te sentires inseguro, afasta-te e denuncia a pessoa na PACE através do botão Denunciar, ou bloqueia-a no perfil.</p>`]

en:{
sobre:`<p>PACE is a free social platform for amateur athletes taking part in IRONMAN 70.3 races. It helps you find people going to the same race as you, with similar goals, and to arrange in-person bike, run and open-water swim workouts.</p>
<h2>How it works</h2>
<p>Every race has its own channel. When you join, you see who else is going, chat with them and can create or join workouts scheduled in the calendar. It all comes down to one simple idea: a race is easier when you don't prepare for it alone.</p>
<h2>Who it's for</h2>
<p>For people who train for the love of it: first-time 70.3 athletes, those who want to improve their time, and anyone just looking for company on the long sessions. You don't need to be fast, you just need to want to train together.</p>
<h2>Independence</h2>
<p>PACE is an independent project with no official affiliation with IRONMAN. IRONMAN and IRONMAN 70.3 are trademarks of their respective owners. Workouts are organized by the athletes themselves, not by PACE.</p>`,
privacidade:`<p class="upd">Last updated: October 2026</p>
<p>This page explains what personal data PACE processes, why, and how you can control it. PACE is an independent project and is responsible for the processing of the data described below.</p>
<h2>What data we collect</h2>
<ul><li><strong>Account:</strong> sign-in uses your Google account. We receive the name and photo from the account. The email is used only for authentication, is managed by the authentication service, and does not appear on your profile or get shown to other athletes.</li>
<li><strong>Profile:</strong> username, country, city or area, bio, target race, time goal, training area and the photo you choose.</li>
<li><strong>Usage:</strong> channels you belong to, workouts you create or join, favorites, athletes you block, notifications and reports you make.</li>
<li><strong>Messages:</strong> the messages you write in channel chats.</li></ul>
<h2>Who sees what</h2>
<p>Your profile and channel messages are visible to other signed-in athletes. You can hide your time goal on your public profile. Your email and other private data never appear on public profiles. Avoid writing addresses, phone numbers or other sensitive data in messages, workout descriptions and your bio.</p>
<h2>What we use the data for</h2>
<p>To create and show your profile, connect you with athletes in the same race, enable chat and workout organization, send you notices about your workouts and handle reports of abusive behavior. We do not sell your data and do not use it for advertising.</p>
<h2>Third-party services</h2>
<p>PACE uses Google services: Firebase (authentication and database, on servers in Europe where indicated) and Google Fonts (typeface). When the page loads, your IP address is seen by these services. We do not use advertising or tracking cookies; the browser stores locally only what is needed to keep you signed in.</p>
<h2>How long we keep it</h2>
<p>We keep the data while your account exists. You can request deletion of your account and associated data at any time.</p>
<h2>Your rights</h2>
<p>Under the GDPR, you have the right of access, rectification, erasure, restriction, objection and portability of your data. You can correct most information directly in Edit profile. For other requests use the Contact page. If you believe the processing violates the law, you may lodge a complaint with the Portuguese data protection authority (CNPD).</p>
<h2>Minimum age</h2>
<p>PACE is intended for people aged 18 or over.</p>
<h2>Changes</h2>
<p>If this policy changes significantly, we will update the date at the top of this page.</p>`,
termos:`<p class="upd">Last updated: October 2026</p>
<p>By creating an account and using PACE you accept these terms. If you do not agree, do not use the service.</p>
<h2>1. The service</h2>
<p>PACE is a free platform that lets amateur athletes meet, chat and arrange workouts for IRONMAN 70.3 races. PACE does not organize workouts, is not a sports body and does not provide medical, training or nutrition advice.</p>
<h2>2. Account</h2>
<p>You sign in with your Google account. You are responsible for your account and for the accuracy of your profile information. You may only have one account, and your username cannot be changed once created.</p>
<h2>3. Conduct</h2>
<p>Treat others with respect. Harassment, threats, discrimination, spam, illegal or offensive content, and sharing other people's personal data without permission are not allowed. You can report messages and profiles and block athletes.</p>
<h2>4. Your content</h2>
<p>What you post (messages, workout descriptions, bio, photo) remains yours. By posting it, you allow PACE to show it to other athletes within the service. You guarantee that you have the right to post it.</p>
<h2>5. In-person workouts and liability</h2>
<p>Workouts are arranged and carried out between athletes, on their own initiative. You take part at your own risk and must assess whether you are physically fit to do so. PACE does not verify the identity, fitness or behavior of athletes and, to the extent permitted by law, is not responsible for injuries, accidents, losses or disputes occurring before, during or after a workout. Read the Workout safety page.</p>
<h2>6. Moderation</h2>
<p>We may remove content and limit or suspend accounts that violate these terms or put other athletes at risk.</p>
<h2>7. Availability</h2>
<p>The service is provided as is, may be interrupted or changed, and we do not guarantee that it will always be available or error-free.</p>
<h2>8. Trademarks</h2>
<p>PACE has no affiliation with IRONMAN. IRONMAN and IRONMAN 70.3 are trademarks of their respective owners.</p>
<h2>9. Changes and applicable law</h2>
<p>We may update these terms; continued use after a change means acceptance. Portuguese law applies.</p>`,
seguranca:`<p>Training in a group is more fun and safer, as long as a few precautions are taken. PACE connects athletes, but everyone is responsible for their own safety. These principles apply to all workouts.</p>
<h2>Before you go</h2>
<ul><li>Arrange to meet in public, well-known places, preferably in daylight.</li>
<li>Tell someone you trust the route, the expected time and who you are going with.</li>
<li>Do not share private addresses. Use public meeting points.</li>
<li>Read the description, distance, pace and difficulty. If you are not sure you can keep up, ask in the chat or choose a beginner workout.</li>
<li>Check the weather and the state of the sea or road. If conditions are bad, postpone.</li>
<li>Bring a charged phone, water and ID. If you have health problems, talk to your doctor first.</li></ul>
<h2>Bike</h2>
<ul><li>Wear a helmet, lights and visible clothing.</li>
<li>Follow the rules of the road and don't take risks to keep up with the group.</li>
<li>Carry repair gear, a spare tube and the essentials for a puncture.</li>
<li>In a group, keep your distance and warn others about obstacles and stops.</li></ul>
<h2>Run</h2>
<ul><li>Bring water and wear visible clothing, especially at sunrise and sunset.</li>
<li>Respect your own pace; nobody is obliged to keep up with the fastest.</li>
<li>On the road, run facing traffic when there is no pavement.</li></ul>
<h2>Open-water swimming</h2>
<ul><li>Always swim accompanied, never alone.</li>
<li>Use a safety buoy and a brightly coloured cap.</li>
<li>Check sea conditions, currents and water temperature before getting in.</li>
<li>Agree on a signal for help and get out of the water at the first sign of tiredness or excessive cold.</li></ul>
<h2>If something goes wrong</h2>
<p>In an emergency, call 112. If someone behaves inappropriately or you feel unsafe, walk away and report the person on PACE using the Report button, or block them on their profile.</p>`

sobre:`<p>PACE est une plateforme sociale gratuite pour les athlètes amateurs qui participent à des courses IRONMAN 70.3. Elle t'aide à trouver des personnes qui vont à la même course que toi, avec des objectifs similaires, et à organiser des entraînements en présentiel de vélo, de course à pied et de natation en eau libre.</p>
<h2>Comment ça marche</h2>
<p>Chaque course a son propre canal. En le rejoignant, tu vois qui d'autre y va, tu discutes avec eux et tu peux créer ou rejoindre des entraînements planifiés dans le calendrier. Tout repose sur une idée simple : une course est plus facile quand on ne la prépare pas seul.</p>
<h2>Pour qui</h2>
<p>Pour ceux qui s'entraînent par plaisir : ceux qui font leur premier 70.3, ceux qui veulent améliorer leur temps et ceux qui cherchent simplement de la compagnie pour les sorties longues. Pas besoin d'être rapide, il suffit d'avoir envie de s'entraîner à plusieurs.</p>
<h2>Indépendance</h2>
<p>PACE est un projet indépendant, sans aucune affiliation officielle avec IRONMAN. IRONMAN et IRONMAN 70.3 sont des marques de leurs titulaires respectifs. Les entraînements sont organisés par les athlètes eux-mêmes, pas par PACE.</p>`,
privacidade:`<p class="upd">Dernière mise à jour : octobre 2026</p>
<p>Cette page explique quelles données personnelles PACE traite, pourquoi, et comment tu peux les contrôler. PACE est un projet indépendant et est responsable du traitement des données décrites ci-dessous.</p>
<h2>Quelles données nous collectons</h2>
<ul><li><strong>Compte :</strong> la connexion se fait avec ton compte Google. Nous recevons le nom et la photo du compte. L'e-mail sert uniquement à l'authentification, est géré par le service d'authentification et n'apparaît pas sur ton profil ni n'est montré aux autres athlètes.</li>
<li><strong>Profil :</strong> nom d'utilisateur, pays, ville ou zone, biographie, course cible, objectif de temps, zone d'entraînement et la photo que tu choisis.</li>
<li><strong>Utilisation :</strong> canaux dont tu es membre, entraînements que tu crées ou rejoins, favoris, athlètes que tu bloques, notifications et signalements que tu fais.</li>
<li><strong>Messages :</strong> les messages que tu écris dans le chat des canaux.</li></ul>
<h2>Qui voit quoi</h2>
<p>Ton profil et les messages des canaux sont visibles par les autres athlètes connectés. Tu peux masquer ton objectif de temps sur ton profil public. L'e-mail et les autres données privées n'apparaissent jamais sur les profils publics. Évite d'écrire des adresses, des numéros de téléphone ou d'autres données sensibles dans les messages, les descriptions d'entraînements et ta biographie.</p>
<h2>À quoi servent les données</h2>
<p>À créer et afficher ton profil, te mettre en relation avec des athlètes de la même course, permettre le chat et l'organisation d'entraînements, t'envoyer des avis sur tes entraînements et traiter les signalements de comportements abusifs. Nous ne vendons pas tes données et ne les utilisons pas à des fins publicitaires.</p>
<h2>Services tiers</h2>
<p>PACE utilise des services Google : Firebase (authentification et base de données, sur des serveurs en Europe lorsque c'est indiqué) et Google Fonts (police de caractères). Au chargement de la page, ton adresse IP est vue par ces services. Nous n'utilisons pas de cookies publicitaires ni de suivi ; le navigateur ne conserve localement que ce qui est nécessaire pour garder ta session ouverte.</p>
<h2>Durée de conservation</h2>
<p>Nous conservons les données tant que ton compte existe. Tu peux demander la suppression de ton compte et des données associées à tout moment.</p>
<h2>Tes droits</h2>
<p>Conformément au RGPD, tu disposes d'un droit d'accès, de rectification, d'effacement, de limitation, d'opposition et de portabilité de tes données. Tu peux corriger la plupart des informations directement dans Modifier le profil. Pour les autres demandes, utilise la page Contact. Si tu estimes que le traitement viole la loi, tu peux déposer une plainte auprès de l'autorité portugaise de protection des données (CNPD).</p>
<h2>Âge minimum</h2>
<p>PACE s'adresse aux personnes de 18 ans ou plus.</p>
<h2>Modifications</h2>
<p>Si cette politique change de façon significative, nous mettrons à jour la date en haut de cette page.</p>`,
termos:`<p class="upd">Dernière mise à jour : octobre 2026</p>
<p>En créant un compte et en utilisant PACE, tu acceptes ces conditions. Si tu n'es pas d'accord, n'utilise pas le service.</p>
<h2>1. Le service</h2>
<p>PACE est une plateforme gratuite qui permet aux athlètes amateurs de se rencontrer, de discuter et d'organiser des entraînements pour des courses IRONMAN 70.3. PACE n'organise pas d'entraînements, n'est pas une entité sportive et ne fournit aucun conseil médical, d'entraînement ou de nutrition.</p>
<h2>2. Compte</h2>
<p>Tu te connectes avec ton compte Google. Tu es responsable de ton compte et de l'exactitude des informations de ton profil. Tu ne peux avoir qu'un seul compte, et le nom d'utilisateur ne peut pas être modifié une fois créé.</p>
<h2>3. Conduite</h2>
<p>Traite les autres avec respect. Le harcèlement, les menaces, la discrimination, le spam, les contenus illégaux ou offensants et le partage de données personnelles de tiers sans autorisation sont interdits. Tu peux signaler des messages et des profils et bloquer des athlètes.</p>
<h2>4. Ton contenu</h2>
<p>Ce que tu publies (messages, descriptions d'entraînements, biographie, photo) reste à toi. En le publiant, tu autorises PACE à l'afficher aux autres athlètes dans le service. Tu garantis avoir le droit de le publier.</p>
<h2>5. Entraînements en présentiel et responsabilité</h2>
<p>Les entraînements sont convenus et réalisés entre athlètes, de leur propre initiative. Tu participes à tes propres risques et tu dois évaluer si tu es en condition physique pour le faire. PACE ne vérifie ni l'identité, ni l'aptitude, ni le comportement des athlètes et, dans la mesure permise par la loi, n'est pas responsable des blessures, accidents, pertes ou conflits survenus avant, pendant ou après un entraînement. Lis la page Sécurité à l'entraînement.</p>
<h2>6. Modération</h2>
<p>Nous pouvons supprimer des contenus, limiter ou suspendre des comptes qui enfreignent ces conditions ou mettent d'autres athlètes en danger.</p>
<h2>7. Disponibilité</h2>
<p>Le service est fourni tel quel, peut subir des interruptions ou des modifications, et nous ne garantissons pas qu'il soit toujours disponible ou exempt d'erreurs.</p>
<h2>8. Marques</h2>
<p>PACE n'a aucune affiliation avec IRONMAN. IRONMAN et IRONMAN 70.3 sont des marques de leurs titulaires respectifs.</p>
<h2>9. Modifications et loi applicable</h2>
<p>Nous pouvons mettre à jour ces conditions ; la poursuite de l'utilisation après modification vaut acceptation. La loi portugaise s'applique.</p>`,
seguranca:`<p>S'entraîner en groupe est plus amusant et plus sûr, à condition de prendre quelques précautions. PACE met les athlètes en relation, mais chacun est responsable de sa propre sécurité. Ces principes s'appliquent à tous les entraînements.</p>
<h2>Avant de partir</h2>
<ul><li>Fixe le rendez-vous dans des lieux publics et connus, de préférence de jour.</li>
<li>Préviens une personne de confiance du parcours, de l'heure prévue et des personnes avec qui tu pars.</li>
<li>Ne partage pas d'adresses privées. Utilise des points de rendez-vous publics.</li>
<li>Lis la description, la distance, l'allure et la difficulté. Si tu n'es pas sûr de pouvoir suivre, demande dans le chat ou choisis un entraînement pour débutants.</li>
<li>Vérifie la météo et l'état de la mer ou de la route. Si les conditions sont mauvaises, reporte.</li>
<li>Emporte un téléphone chargé, de l'eau et une pièce d'identité. Si tu as des problèmes de santé, parles-en d'abord à ton médecin.</li></ul>
<h2>Vélo</h2>
<ul><li>Porte un casque, des feux et des vêtements visibles.</li>
<li>Respecte le code de la route et ne prends pas de risques pour suivre le groupe.</li>
<li>Emporte du matériel de réparation, une chambre à air et l'essentiel en cas de crevaison.</li>
<li>En groupe, garde tes distances et signale les obstacles et les arrêts aux autres.</li></ul>
<h2>Course à pied</h2>
<ul><li>Emporte de l'eau et porte des vêtements visibles, surtout au lever et au coucher du soleil.</li>
<li>Respecte ton rythme ; personne n'est obligé de suivre les plus rapides.</li>
<li>Sur la route, cours face à la circulation quand il n'y a pas de trottoir.</li></ul>
<h2>Natation en eau libre</h2>
<ul><li>Nage toujours accompagné, jamais seul.</li>
<li>Utilise une bouée de sécurité et un bonnet de couleur vive.</li>
<li>Vérifie les conditions de la mer, le courant et la température de l'eau avant d'entrer.</li>
<li>Convenez d'un signal d'aide et sors de l'eau dès les premiers signes de fatigue ou de froid excessif.</li></ul>
<h2>Si quelque chose ne va pas</h2>
<p>En cas d'urgence, appelle le 112. Si quelqu'un se comporte de façon inappropriée ou si tu te sens en danger, éloigne-toi et signale la personne sur PACE avec le bouton Signaler, ou bloque-la sur son profil.</p>`

function cleanAct(x){
 const idr=/^[\w-]{1,128}$/,num=v=>{const n=Number(v);return isFinite(n)?n:0};

 x.org=idr.test(String(x.org))?String(x.org):'';x.race=String(x.race||'');
 x.max=Math.max(0,Math.floor(num(x.max)));x.dist=num(x.dist);x.spd=num(x.spd)||0;
 x.dur=x.dur?(num(x.dur)||''):'';x.elev=x.elev?(num(x.elev)||''):'';
 x.pace=/^\d{1,2}:[0-5]\d$/.test(x.pace)?x.pace:'';
 x.tm=/^\d\d:\d\d$/.test(x.tm)?x.tm:'00:00';
 x.date=/^\d{4}-\d\d-\d\d$/.test(x.date)?x.date:'1970-01-01';
 x.diff=['Fácil','Moderado','Difícil'].includes(x.diff)?x.diff:'Moderado';
 x.beg=!!x.beg;x.pr=!!x.pr;
 ['title','place','addr','desc','tipo','mat','nota'].forEach(k=>x[k]=x[k]==null?'':String(x[k]));
 return x}

async function finishOnb(){
 const g=id=>$('#'+id),v=id=>g(id).value.trim(),er={},un=v('o-un').toLowerCase();
 if(v('o-n').length<2)er.n='Indica o teu nome.';
 if(!/^[a-z0-9_]{3,20}$/.test(un))er.un='3 a 20 caracteres: letras, números ou _.';
 if(!v('o-city'))er.city='Indica a tua cidade ou zona.';
 const paint=()=>document.querySelectorAll('#onb [data-e]').forEach(s=>s.textContent=er[s.dataset.e]||'');
 paint();const k=Object.keys(er)[0];
 if(k){({n:'o-n',un:'o-un',city:'o-city'}[k]&&g({n:'o-n',un:'o-un',city:'o-city'}[k]).focus());return}
 const uid=UID(),rid=g('o-r').value,btn=$('#onb button[type=submit]');btn.disabled=true;
 const data={name:v('o-n').slice(0,60),username:un,city:v('o-city').slice(0,60),country:g('o-c').value,sports:['bike','run','swim'],goal:g('o-g').value,gt:v('o-gt').slice(0,20),zone:v('o-z').slice(0,80),hid:g('o-h').checked,onboarded:true};
 if(S.tmpPhoto)data.photo=S.tmpPhoto;
 if(rid){data.channels=arrayUnion(rid);data.raceId=rid}
 try{
  await runTransaction(db,async tx=>{
   const nr=doc(db,'usernames',un),ns=await tx.get(nr);
   if(ns.exists()&&ns.data().uid!==uid)throw new Error('taken');
   if(!ns.exists())tx.set(nr,{uid});
   tx.update(doc(db,'users',uid),data)});
  S.tmpPhoto='';S.pendingRace=null;toast('Perfil criado');
  if(rid)go('canal',rid);else go('home')
 }catch(e){btn.disabled=false;if(e.message==='taken'){er.un='Esse username já existe.';paint();g('o-un').focus()}else subErr(e)}}

let chatUnsub=null,chatRace=null;
function unsubChat(){if(chatUnsub){try{chatUnsub()}catch(_){}}chatUnsub=null;chatRace=null}
function subChat(raceId){
 if(chatRace===raceId)return;unsubChat();chatRace=raceId;CHAT[raceId]=[];
 chatUnsub=onChildAdded(rquery(rref(rdb,'chats/'+raceId+'/messages'),limitToLast(100)),snap=>{
  const val=snap.val();if(!val)return;
  CHAT[raceId].push({k:snap.key,...val});
  if(S.route==='canal'&&S.param===raceId&&S.tab==='chat')paintMsgs()
 },e=>{console.warn(e);toast('Não foi possível ler o chat (regras da Realtime Database).')})}
function syncChat(){if(S.route==='canal'&&S.auth&&S.param&&RACES.some(r=>r.id===S.param))subChat(S.param);else if(chatRace)unsubChat()}
function dayLabel(ts){const d=new Date(ts),t=new Date(),y=new Date();y.setDate(t.getDate()-1);return d.toDateString()===t.toDateString()?'Hoje':d.toDateString()===y.toDateString()?'Ontem':d.toLocaleDateString(LOC(),{day:'numeric',month:'long'})}
const hm=ts=>new Date(ts).toTimeString().slice(0,5);
function msgsHtml(id){
 const L=CHAT[id]||[];if(!L.length)return `<div class='empty' style='margin-top:16px'>Ainda não há mensagens. Sê o primeiro a escrever.</div>`;
 let h='',pd=null,pa=null;
 L.forEach(m=>{
  const a=ath(m.uid)||{id:m.uid,name:m.name||'Atleta',role:'Atleta'},ts=m.ts||Date.now(),dk=new Date(ts).toDateString();
  if(dk!==pd){h+=`<div class='day'><span>${dayLabel(ts)}</span></div>`;pd=dk;pa=null}
  if(BL.has(m.uid)){if(pa!=='b'+m.uid){h+=`<p class='note blk'>Mensagens de ${esc(a.name)} ocultas (bloqueado).</p>`;pa='b'+m.uid}return}

  const f=pa!==m.uid;pa=m.uid;
  h+=`<div class='msg${f?'':' cont'}'>${f?`<button class='avb' data-act='atleta' data-id='${esc(a.id)}' aria-label='Perfil de ${esc(a.name)}'>${av(a)}</button>`:`<span class='sp'></span>`}<div class='mb'>${f?`<div class='mh'><button class='an nm-${roleOf(a)}' data-act='atleta' data-id='${esc(a.id)}'>${esc(a.name)}</button>${rb(a.role||'Atleta')}<time>${hm(ts)}</time></div>`:''}<p translate='no'>${esc(m.text)}</p><div class='ma'><button data-act='copy' data-k='${esc(m.k)}'>Copiar</button>${m.uid!==UID()?`<button data-act='rep' data-uid='${esc(m.uid)}' data-k='${esc(m.k)}'>Denunciar</button>`:''}</div></div></div>`});
 return h}

function compat(a){const u=S.user;if(!u)return 0;const o=ath(a.org);return 2+(u.goal&&o&&o.goal===u.goal?2:0)+(isMember(a.race)?1:0)}
function xlist(){const l=ACT.filter(a=>{const rc=RACES.find(r=>r.id===a.race),o=ath(a.org);return a.st==='ok'&&!isPast(a)&&(!F.sp||a.sport===F.sp)&&(!F.beg||a.beg)&&(!F.vag||!full(a))&&(!F.n||a.diff===F.n)&&(!F.km||a.dist<=parseFloat(F.km))&&(!F.c||(rc&&rc.city===F.c))&&(!F.d||a.date>=F.d)&&(!F.g||(o&&o.goal===F.g))&&(!F.org||a.org===F.org||a.p.includes(F.org))&&(!F.q||(a.title+' '+a.place).toLowerCase().includes(F.q.toLowerCase()))});l.sort(F.o==='v'?(a,b)=>(b.max?b.max-b.p.length:99)-(a.max?a.max-a.p.length:99):F.o==='c'?(a,b)=>compat(b)-compat(a):byDate);return l.length?`<div class='grid'>${l.map(a=>actTile(a.id)).join('')}</div>`:EM('Nenhum treino encontrado','Altera os filtros ou cria um treino num canal.','Ir para os meus canais','minhas')}
function explorar(){const sel=(id,l,o,v)=>`<select id='${id}' aria-label='${l}'><option value=''>${l}</option>${o.map(([k,t])=>`<option value='${k}' ${v===k?'selected':''}>${t}</option>`).join('')}</select>`;return `<div class='wrap page'><h1>Explorar treinos</h1><p style='color:var(--muted);margin-bottom:24px'>Treinos de todos os canais. A compatibilidade usa regras simples: modalidade, objetivo e canais em que estás.</p>${F.org?`<p class='note' style='margin-bottom:12px'>Treinos de ${esc((ath(F.org)||{}).name||'')} <button class='an' data-act='nox'>Limpar</button></p>`:''}<div class='tools'><div class='field'>${ic('search')}<input id='x-q' type='search' placeholder='Pesquisar treinos' aria-label='Pesquisar treinos' value='${esc(F.q)}'></div>${sel('x-s','Todas as modalidades',Object.entries(SPORTS),F.sp)}${sel('x-n','Qualquer nível',['Fácil','Moderado','Difícil'].map(x=>[x,x]),F.n)}${sel('x-c','Qualquer cidade',[...new Set(RACES.map(r=>r.city))].map(x=>[x,x]),F.c)}${sel('x-g','Qualquer objetivo',Object.entries(GOALS),F.g)}<input id='x-km' type='number' min='1' placeholder='Distância máx. (km)' aria-label='Distância máxima em km' value='${esc(F.km)}'><input id='x-d' type='date' aria-label='A partir de' value='${esc(F.d)}'><select id='x-o' aria-label='Ordenar'><option value='d'>Data mais próxima</option><option value='v' ${F.o==='v'?'selected':''}>Mais vagas</option><option value='c' ${F.o==='c'?'selected':''}>Maior compatibilidade</option></select><label class='ck'><input type='checkbox' id='x-b' ${F.beg?'checked':''}> Para iniciantes</label><label class='ck'><input type='checkbox' id='x-v' ${F.vag?'checked':''}> Com vagas</label></div><div id='xl'>${xlist()}</div></div>`}
function cal(){const l=ACT.filter(a=>a.st==='ok'&&!isPast(a)).sort(byDate);let h='',pd='';l.forEach(a=>{if(a.date!==pd){pd=a.date;h+=`<h2 style='margin:20px 0 8px'>${new Date(a.date+'T12:00').toLocaleDateString(LOC(),{weekday:'long',day:'numeric',month:'long'})}</h2>`}h+=`<div style='max-width:520px;margin-bottom:10px'>${actCard(a.id)}</div>`});return `<div class='wrap page'><h1>Calendário</h1><p style='color:var(--muted)'>Próximos treinos, por data.</p>${h||EM('Sem treinos marcados','Cria o primeiro treino num canal.','Ir para os meus canais','minhas')}</div>`}
function favs(){const r=RACES.filter(x=>FAV.has('r:'+x.id)),a=ACT.filter(x=>FAV.has('a:'+x.id));return `<div class='wrap page'><h1>Favoritos</h1>${r.length||a.length?(r.length?`<h2 style='margin:16px 0'>Provas</h2><div class='grid'>${r.map(raceCard).join('')}</div>`:'')+(a.length?`<h2 style='margin:16px 0'>Atividades</h2><div class='grid'>${a.map(x=>actCard(x.id)).join('')}</div>`:''):EM('Ainda sem favoritos','Guarda provas e treinos para os encontrares aqui.','Explorar provas','home')}</div>`}
function notif(){return `<div class='wrap page'><h1>Notificações</h1><p style='color:var(--muted);margin-bottom:16px'>Avisos sobre os teus treinos e inscrições.</p>${NT.length?`<ul style='list-style:none;padding:0;display:grid;gap:8px;max-width:640px'>${NT.map(n=>`<li class='box' style='padding:12px 16px;${n.r?'':'border-left:4px solid var(--green)'}'>${n.r?'':'<span class="badge">Nova</span> '}${esc(n.x)}</li>`).join('')}</ul><button class='btn btn-o' style='margin-top:16px' data-act='nt'>Marcar tudo como lido</button>`:EM('Sem notificações','Quando alguém aderir ou alterar um treino, aparece aqui.','Explorar treinos','treinos')}</div>`}
/* ============ ROTEAMENTO / RENDER ============ */
function view(){
 if(!S.ready)return `<div class="wrap page"><div class="skel"></div></div>`;
 if(needOnb())return register();
 if(PROT.includes(S.route)&&!S.user)return needLogin();
 switch(S.route){
  case"home":return home();
  case"registo":return register();
  case'canal':return canal();case'atleta':return atleta(S.param);case'perfil':return atleta('me');case'minhas':return minhas();
  case'treinos':return explorar();
  case"definicoes":return defs();case"calendario":return cal();case"favoritos":return favs();case"notificacoes":return notif();
  case"info":return `<div class="wrap page"><h1>${INFO[S.param][0]}</h1><div class="legal">${infoBody(S.param)}</div></div>`;
  default:return `<div class="wrap page"><h1>Página não encontrada</h1><p style="color:var(--muted);margin-bottom:20px">Esta página não existe. Volta às provas e continua a partir daí.</p><button class="btn btn-p" data-act="go" data-r="home">Voltar ao início</button></div>`}
}
function render(keep){
 const ae=document.activeElement,fo=keep&&ae&&ae.id&&$('#app').contains(ae)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null,vals={};
 if(keep)document.querySelectorAll('#app input[id],#app textarea[id],#app select[id]').forEach(e=>{if(e.type!=='file')vals[e.id]=e.type==='checkbox'?e.checked:e.value});
 const vk=S.route+'|'+S.param+'|'+S.tab+'|'+needOnb()+'|'+!!S.user,mg=$('#msgs'),near=!mg||mg.scrollHeight-mg.scrollTop-mg.clientHeight<80,top=mg?mg.scrollTop:0,sameView=keep&&vk===S._vk;
 $("#app").innerHTML=header()+"<main>"+view()+"</main>"+footer()+bnav();
 if(sameView){Object.entries(vals).forEach(([id,v])=>{const el=document.getElementById(id);if(!el)return;if(el.type==='checkbox')el.checked=v;else el.value=v});
  if(fo){const el=document.getElementById(fo.id);if(el){el.focus();try{el.setSelectionRange(fo.s,fo.e)}catch(_){}}}}
 S._vk=vk;
 const m2=$('#msgs');if(m2)m2.scrollTop=(sameView&&!near)?top:m2.scrollHeight;
 syncChat()}
function refresh(){render(true);const m=$('#modal');if(m&&m.dataset.k==='det'&&S.det){if(A(S.det))showDet(S.det);else closeModal()}}
function modal(html,key){closeModal();const m=document.createElement("div");m.className="modal";m.id="modal";m.dataset.k=key||'';m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(m);const b=m.querySelector("button");b&&b.focus()}
function closeModal(){const m=$("#modal");m&&m.remove();S.det=null}
async function enter(id){
 const r=RACES.find(x=>x.id===id);S.pendingRace=id;
 if(S.user){if(!isMember(id)){await joinRace(id);toast('Entraste no canal')}S.pendingRace=null;return go('canal',id)}
 modal(`<h2>Entrar em ${esc(r.name)}</h2><p>Faz login para entrares no canal, falares com outros atletas e combinares treinos.</p><div class="acts">${gbtn()}<button class="btn btn-o" data-act="close">Agora não</button></div>`)}
function share(){const h=(S.det&&$('#modal'))?'#/atividade/'+S.det:(location.hash||'#/home'),u=location.href.split('#')[0]+h;try{navigator.clipboard.writeText(u).then(()=>toast('Ligação copiada'),()=>toast(u))}catch(_){toast(u)}}
function ics(id){const a=A(id),p=n=>String(n).padStart(2,'0'),st=new Date(a.date+'T'+a.tm),en=new Date(st.getTime()+(a.dur?a.dur:120)*6e4),f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00',cl=x=>String(x).replace(/[,;\n]/g,' ');const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PACE//PT','BEGIN:VEVENT','UID:'+a.id+'@pace','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+f(st),'DTEND:'+f(en),'SUMMARY:'+cl(a.title),'LOCATION:'+cl(a.place),'END:VEVENT','END:VCALENDAR'].join('\r\n');try{const u=URL.createObjectURL(new Blob([t],{type:'text/calendar'})),l=document.createElement('a');l.href=u;l.download='treino-'+a.id+'.ics';document.body.appendChild(l);l.click();l.remove();toast('Ficheiro .ics gerado')}catch(_){toast('Não foi possível gerar o .ics')}}
function fromHash(){const m=location.hash.match(/^#\/(\w+)(?:\/([\w-]+))?/);if(!m)return;const r=m[1],p=m[2]||null;if(r==='atividade'){S.pendAct=p;return}if(r==='info'&&!INFO[p])return;if(['canal','atleta','info','registo'].includes(r)||NAV.some(n=>n[0]===r))go(r,p,true)}
/* ============ EVENTOS ============ */
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-act]");if(!t)return;
 const a=t.dataset.act,d=t.dataset;
 switch(a){
  case'go':closeModal();$("#drawer")&&$("#drawer").classList.remove("open");go(d.r);break;
  case'menu':{const dr=$("#drawer");dr.classList.toggle("open");const bg=$(".burger");bg.setAttribute("aria-expanded",dr.classList.contains("open"));break}
  case'login':closeModal();$("#drawer")&&$("#drawer").classList.remove("open");signIn();break;
  case'logout':closeModal();$("#drawer")&&$("#drawer").classList.remove("open");try{await signOut(auth);toast('Sessão terminada');go('home')}catch(_){toast('Não foi possível terminar a sessão.')}break;
  case'enter':enter(d.id);break;
  case'close':closeModal();break;
  case'rcode':codeForm();break;
  case'rcsub':redeem();break;
  case'gcode':genForm();break;
  case'gcgo':genCode();break;
  case'cpcode':try{navigator.clipboard.writeText(d.c).then(()=>toast('Código copiado'),()=>toast(d.c))}catch(_){toast(d.c)}break;
  case'info':go("info",d.k);break;
  case'toast':toast(d.m);break;
  case'newact':if(!isMember(S.param))return toast('Entra no canal para criar atividades.');actForm();break;
  case'det':showDet(d.id);break;
  case'jact':jact(d.id);break;
  case'lact':lact(d.id);break;
  case'cact':cact(d.id);break;
  case'eact':closeModal();actForm(d.id);break;
  case'canal':go('canal',d.id);break;
  case'atleta':go('atleta',d.id);break;
  case'tab':S.tab=d.t;render();break;
  case'atl':S.tab='membros';render();{const sb=$('.sb');sb&&sb.scrollIntoView({block:'start'})}break;
  case'leave':try{const up={channels:arrayRemove(d.id)};if(S.user.raceId===d.id)up.raceId='';await updateDoc(doc(db,'users',UID()),up);toast('Saíste do canal')}catch(er){subErr(er)}break;
  case'send':sendMsg();break;
  case'copy':{const m=(CHAT[S.param]||[]).find(x=>x.k===d.k);if(m)try{navigator.clipboard.writeText(m.text).then(()=>toast('Texto copiado'),()=>toast('Não foi possível copiar'))}catch(_){toast('Não foi possível copiar')}break}
  case'rep':modal(`<h2>Denunciar</h2><p class='note' style='margin-bottom:10px'>A denúncia é enviada à equipa PACE para revisão.</p><label for='rp-t'>Motivo</label><textarea id='rp-t' maxlength='300' placeholder='Descreve o problema'></textarea><div class='acts'><button class='btn btn-p' data-act='sendrep' data-uid='${esc(d.uid||'')}' data-k='${esc(d.k||'')}'>Enviar denúncia</button><button class='btn btn-o' data-act='close'>Cancelar</button></div>`);break;
  case'sendrep':{const tx=($('#rp-t')||{}).value||'';if(tx.trim().length<3)return toast('Indica o motivo.');try{await addDoc(collection(db,'reports'),{by:UID(),target:d.uid||'',msgKey:d.k||'',race:S.param&&S.route==='canal'?S.param:'',text:tx.trim().slice(0,300),ts:serverTimestamp()});closeModal();toast('Denúncia enviada')}catch(er){subErr(er)}break}
  case'blk':try{const has=BL.has(d.id);await updateDoc(doc(db,'users',UID()),{blocked:has?arrayRemove(d.id):arrayUnion(d.id)});toast(has?'Atleta desbloqueado':'Atleta bloqueado: as mensagens ficam ocultas')}catch(er){subErr(er)}break;
  case'back':history.length>1?history.back():go('home');break;
  case'share':share();break;
  case'hg':try{await updateDoc(doc(db,'users',UID()),{hid:!S.user.hid})}catch(er){subErr(er)}break;
  case'clear':S.q="";S.country="";S.sort="rel";render();break;
  case'scroll':{const el=$("#provas");el&&el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});break}
  case'sf':S.sf=d.s;S.tab=d.t;render();break;
  case'fav':{if(!S.user)return toast('Inicia sessão para guardar favoritos.');const k=d.k,has=FAV.has(k);try{await updateDoc(doc(db,'users',UID()),{favs:has?arrayRemove(k):arrayUnion(k)});toast(has?'Removido dos favoritos':'Guardado nos favoritos')}catch(er){subErr(er)}break}
  case'vt':F.org=d.id;go('treinos');break;
  case'nox':F.org='';render();break;
  case'ics':ics(d.id);break;
  case'nt':{const b=writeBatch(db);NT.filter(n=>!n.r).forEach(n=>b.update(doc(db,'users',UID(),'notifs',n.id),{r:true}));try{await b.commit()}catch(er){subErr(er)}break}
  case'rmphoto':try{await updateDoc(doc(db,'users',UID()),{photo:''});toast('A usar a foto da conta')}catch(er){subErr(er)}break;
 }
});
document.addEventListener("keydown",e=>{if(e.target.id==='cin'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();return}if(e.key==="Escape"){closeModal();const d=$("#drawer");d&&d.classList.remove("open")}});
const XM={'x-n':'n','x-km':'km','x-c':'c','x-d':'d','x-g':'g'};
['input','change'].forEach(ev=>document.addEventListener(ev,async e=>{
 const t=e.target,i=t.id;
 if(t.classList&&t.classList.contains('lang')){setLang(t.value)}
 else if(i==='q'){S.q=t.value;$("#grid").innerHTML=raceGrid()}
 else if(i==='country'){S.country=t.value;$("#grid").innerHTML=raceGrid()}
 else if(i==='sort'){S.sort=t.value;$("#grid").innerHTML=raceGrid()}
 else if(i==='x-q'){F.q=t.value;$('#xl').innerHTML=xlist()}
 else if(i==='x-s'||i==='x-o'||i==='x-b'||i==='x-v'){if(i==='x-s')F.sp=t.value;if(i==='x-o')F.o=t.value;if(i==='x-b')F.beg=t.checked;if(i==='x-v')F.vag=t.checked;$('#xl').innerHTML=xlist()}
 else if(XM[i]){F[XM[i]]=t.value;$('#xl').innerHTML=xlist()}
 else if(i==='p-v'||i==='p-b'){S.af[i==='p-v'?'vag':'beg']=t.checked;const p=$('#pl');p&&(p.innerHTML=plist(S.param))}
 else if(i==='s-ph'&&ev==='change'&&t.files[0]){try{const d=await resizeImg(t.files[0]);await updateDoc(doc(db,'users',UID()),{photo:d});toast('Foto atualizada')}catch(er){toast(errMsg(er))}t.value=''}
 else if(i==='o-ph'&&ev==='change'&&t.files[0]){try{S.tmpPhoto=await resizeImg(t.files[0]);const keep={};['o-n','o-un','o-c','o-city','o-r','o-g','o-gt','o-z'].forEach(k=>keep[k]=$('#'+k).value);const h=$('#o-h').checked;render();Object.entries(keep).forEach(([k,v])=>$('#'+k).value=v);$('#o-h').checked=h}catch(er){toast(errMsg(er))}}
 if(t.closest&&t.closest('#af')){if(i==='a-s'){S.draft['a-s']=t.value;$('#sfw').innerHTML=sf(t.value);restore()}else S.draft[i]=t.type==='checkbox'?t.checked:t.value}
}));
document.addEventListener("submit",e=>{
 e.preventDefault();const id=e.target.id;
 if(id==='af')pubAct();else if(id==='onb')finishOnb();else if(id==='setf')saveSettings()});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset&&t.dataset.rid){const r=RACES.find(x=>x.id===t.dataset.rid);if(r)t.outerHTML=waves(r.tone)}},true);
/* ============ ARRANQUE ============ */
try{history.replaceState({r:'home',p:null},'')}catch(_){}
addEventListener('popstate',e=>{closeModal();const s=e.state||{r:'home',p:null};go(s.r,s.p,true)});
render();fromHash();setTitle();
</script>
</body>
</html>
